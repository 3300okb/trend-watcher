<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trend Watcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@100;400;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      .font-seed {
        font-family: 'LINE Seed JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      }

      @keyframes skeleton-shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
        background-size: 200% 100%;
        animation: skeleton-shimmer 1.4s ease infinite;
      }

      /* Grid子要素がコンテンツ幅で親を押し広げないようにする（iOS横はみ出し対策） */
      .grid > * {
        min-width: 0;
      }
    </style>
    <link rel="stylesheet" href="./assets/tailwind.css" />
    <style>
      /* iOS Safari: デフォルトのタップハイライトを無効化し、300ms タップ遅延を排除 */
      button, a {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      /* iOS Safari の sticky hover 対策:
         タップ後に要素がシフトすると、指の座標にある次の要素に :hover が貼り付く問題を防ぐ。
         hover: none = タッチデバイス（実ホバーなし）にのみ適用 */
      @media (hover: none) {
        .hover\:border-red-300:hover  { border-color: rgb(226 232 240); }
        .hover\:bg-red-50:hover       { background-color: rgb(248 250 252); }
        .hover\:text-red-600:hover    { color: rgb(148 163 184); }
        .hover\:border-cyan-300:hover { border-color: rgb(226 232 240); }
        .hover\:border-cyan-400:hover { border-color: rgb(165 243 252); }
        .hover\:bg-cyan-50:hover      { background-color: rgb(248 250 252); }
        .hover\:bg-cyan-100:hover     { background-color: rgb(236 254 255); }
        .hover\:text-cyan-700:hover   { color: rgb(100 116 139); }
      }
    </style>
  </head>
  <body class="min-h-screen font-seed text-ink antialiased px-4">
    <div class="mx-auto max-w-6xl">
      <header class="relative py-6 flex items-center justify-between gap-4">
        <h1 class="relative sm:text-lg lg:text-2xl font-bold leading-tight">Trend Watcher</h1>
        <div class="flex items-center gap-2">
          <!-- ログインボタン（未ログイン時） -->
          <button
            id="auth-btn"
            class="flex items-center gap-1.5 rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs text-slate-500 hover:border-cyan-300 hover:bg-cyan-50 hover:text-cyan-700 transition font-seed"
            type="button"
          >
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Sign in with Google
          </button>
          <!-- ユーザー情報（ログイン済み時） -->
          <div id="auth-user" style="display:none" class="items-center gap-2">
            <span id="auth-email" class="text-xs text-slate-500 max-w-[140px] truncate font-seed"></span>
            <button
              id="auth-logout-btn"
              class="rounded-full border border-slate-200 bg-slate-50 px-2.5 py-1 text-xs text-slate-400 hover:border-red-300 hover:bg-red-50 hover:text-red-600 transition font-seed"
              type="button"
            >Sign out</button>
          </div>
        </div>
      </header>

      <main class="grid gap-6">
        <section id="savedSection" class="hidden rounded-2xl border border-cyan-200 bg-white/90 p-4 sm:p-6">
          <div class="mb-3 flex items-center justify-between">
            <h2 class="text-sm font-semibold text-slate-700 whitespace-nowrap">
              Saved
              <span id="savedCount" class="ml-1 inline-flex h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-cyan-100 px-1.5 text-xs text-cyan-700"></span>
            </h2>
            <div class="flex items-center gap-2">
              <button id="syncSavedBtn" style="display:none" class="rounded-full border border-cyan-200 bg-cyan-50 px-2.5 py-1 text-xs text-cyan-600 hover:border-cyan-400 hover:bg-cyan-100 transition font-seed" type="button">Sync</button>
              <button id="clearSavedBtn" class="rounded-full border border-slate-200 bg-slate-50 px-2.5 py-1 text-xs text-slate-400 hover:border-red-300 hover:bg-red-50 hover:text-red-600 transition font-seed" type="button">Clear all</button>
            </div>
          </div>
          <ul id="savedList" class="grid gap-2 list-none" aria-busy="true"></ul>
        </section>

        <section class="rounded-2xl border border-mist bg-white/85 p-4 backdrop-blur sm:p-5">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-600">Topics</p>
            <div class="mt-3 flex flex-wrap gap-2" id="topicList"></div>
          </div>
        </section>

        <section class="rounded-2xl border border-mist bg-white/90 p-4 sm:p-6">
          <div class="mb-4">
            <p id="metaText" class="meta text-xs text-slate-500 sm:text-sm"></p>
          </div>
          <ul id="trendList" class="trend-list grid gap-3 sm:gap-4 list-none" aria-busy="true"></ul>
        </section>
      </main>
    </div>

    <template id="trendItemTemplate">
      <li class="trend-item group rounded-2xl border border-slate-200 bg-white p-4 transition duration-200">
        <div class="flex items-start justify-between gap-2 min-w-0">
          <a
            class="trend-title text-base font-semibold leading-6 transition text-blue-700 sm:text-lg hover:underline min-w-0 break-words"
          ></a>
          <button
            class="save-btn shrink-0 rounded-full border px-2.5 py-1 text-xs transition font-seed border-slate-200 bg-slate-50 text-slate-500 hover:border-slate-300 hover:bg-slate-100 hover:text-slate-600"
            type="button"
            aria-label="Save"
          >Save</button>
        </div>
        <p class="trend-summary mt-2 line-clamp-2 text-sm leading-6 text-slate-600"></p>
        <div class="trend-meta mt-3 flex flex-wrap items-center gap-2 text-xs text-slate-500">
          <span class="category rounded-full border border-cyan-200 bg-cyan-50 px-2.5 py-1 tracking-wide text-cyan-700"></span>
          <span class="source rounded-full border border-slate-200 bg-slate-50 px-2.5 py-1"></span>
          <span class="published"></span>
        </div>
      </li>
    </template>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="./assets/supabase-config.js"></script>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
